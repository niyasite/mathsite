<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>درسنامه ریاضی</title>

<style>

body{
    font-family:tahoma;
    background:#f4f6f9;
    margin:0;
    padding:0;
}

.header{
    text-align:center;
    padding:40px;
    background:#2c3e50;
    color:white;
}

.container{
    width:90%;
    margin:auto;
    margin-top:50px;

    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.card{
    width:280px;
    background:white;
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card h3{
    color:#2c3e50;
}

.card a{
    text-decoration:none;
}

.btn{
    background:#3498db;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.btn:hover{
    background:#2980b9;
}

</style>
</head>

<body>

<div class="header">
    <h1>درسنامه ریاضی</h1>
    <p>موضوع مورد نظر خود را انتخاب کنید</p>
</div>

<div class="container">

{% for topic in topics %}

<div class="card">

    <h3>{{ topic.title }}</h3>

    <p>
        برای مشاهده آموزش کامل این مبحث کلیک کنید.
    </p>

    <a href="{% url 'step_view' topic.id 1 %}">
        <button class="btn">
            ورود به درس
        </button>
    </a>

</div>

{% endfor %}

</div>

</body>
</html>
